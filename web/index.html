<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside the Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wdth,wght@75..112,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="stage">
        <video id="broadcast" playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="wordmark" aria-hidden="true">
          <span class="corner"></span>
          <span class="name">INSIDE THE GAME</span>
        </div>
        <aside id="evidence" class="evidence hidden"></aside>
      </div>
      <div class="console">
        <button id="play-pause" class="play-btn" aria-label="Play">
          <svg id="icon-play" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><polygon points="4,2 16,9 4,16" fill="currentColor" /></svg>
          <svg id="icon-pause" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="display: none"><rect x="3" y="2" width="4" height="14" fill="currentColor" /><rect x="11" y="2" width="4" height="14" fill="currentColor" /></svg>
        </button>

        <div class="timecode-block">
          <div id="clock" class="num">00:00</div>
          <div class="lab">OF <span id="total-clock">00:00</span></div>
        </div>

        <div class="scrubwrap">
          <div class="scrub-track"></div>
          <div id="scrub-fill" class="scrub-fill"></div>
          <div id="scrub-ticks" class="scrub-ticks"></div>
          <div class="scrub-ruler"></div>
          <div id="scrub-minutes" class="scrub-minutes"></div>
          <div id="scrub-ph" class="scrub-ph"></div>
          <input id="seek" class="scrub-input" type="range" min="0" max="1" step="0.0005" value="0" aria-label="Match time" />
        </div>

        <div class="seg-group" id="modeTabs" role="group" aria-label="Mode">
          <button class="seg" data-value="analyst" aria-pressed="true">ANALYST</button>
          <button class="seg" data-value="casual" aria-pressed="false">CASUAL</button>
          <button class="seg" data-value="player_focus" aria-pressed="false">PLAYER</button>
        </div>
        <div class="seg-group" id="langTabs" role="group" aria-label="Language">
          <button class="seg" data-value="en" aria-pressed="true">EN</button>
          <button class="seg" data-value="tr" aria-pressed="false">TR</button>
        </div>
        <div class="seg-group">
          <button id="live" class="seg live" aria-pressed="false">LIVE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
