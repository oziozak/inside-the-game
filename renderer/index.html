<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside the Game · Broadcast renderer</title></head>
<body><main><header><span class="eyebrow">INSIDE THE GAME / SYNTHETIC BROADCAST</span><h1><span id="home-name">Home</span> <span>×</span> <span id="away-name">Away</span></h1><p>3D match renderer · 25 frames per second</p></header>
<section id="stage"><canvas id="pitch" aria-label="Synthetic football match"></canvas><output id="clock"></output></section>
<section id="controls"><button id="play" disabled>Play</button><input id="seek" type="range" min="0" max="60" step="0.04" value="0" aria-label="Match time"><select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><label><input id="debug" type="checkbox" checked> Clock</label><label><input id="rich" type="checkbox"> Rich presentation</label></section>
<section class="load"><label><input id="cv-visibility" type="checkbox"> CV visibility</label><label><input id="jersey-numbers" type="checkbox"> Shirt numbers</label><label><input id="animate-players" type="checkbox" checked> Player motion</label><label>Camera <select id="camera"><option value="cv_full_pitch">CV full pitch</option><option value="broadcast">Broadcast</option></select></label><label>Player scale <input id="player-scale" type="number" min="0.25" max="5" step="0.25" value="1"></label><label>Ball scale <input id="ball-scale" type="number" min="0.25" max="5" step="0.25" value="1"></label></section>
<section class="load"><label>Match metadata <input id="metadata" type="file" accept=".json"></label><label>Tracking <input id="tracking" type="file" accept=".jsonl"></label><button id="load">Load files</button></section><p id="status" role="status">Loading sample tracking…</p></main><script type="module" src="/src/main.ts"></script></body></html>
